name: fenjiu-local-runtime

services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: fenjiu_local_only
      POSTGRES_USER: fenjiu_local
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /pgdata/data
    expose:
      - "5432"
    volumes:
      - postgres_data:/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fenjiu_local -d fenjiu_local_only"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    expose:
      - "6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: python:3.13.9-slim-bookworm
    working_dir: /workspace
    command: ["python", "-m", "apps.api.local_runtime", "--serve", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.api.local_runtime", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    image: python:3.13.9-slim-bookworm
    working_dir: /workspace
    command: ["python", "-m", "apps.worker.local_runtime", "--idle"]
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.local_runtime", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  admin:
    image: python:3.13.9-slim-bookworm
    working_dir: /workspace
    command: ["python", "-m", "apps.admin.local_runtime", "--serve", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001"
    volumes:
      - .:/workspace:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.admin.local_runtime", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  valkey_data:
