plan:
  id: fenjiu-ai-native-sales-os-phase-0-8
  status: planned
  business_line_default: fenjiu_nepal
  external_execution_default: false
  readiness_status_keys: [technical_ready, data_ready, business_external_ready]
  external_action_defaults:
    external_send: false
    public_publish: false
    real_quote: false
    payment: false
    order_create: false
    refund: false
  source_of_truth: docs/project/BUSINESS_STATUS.md
  command_contract:
    - make bootstrap
    - make dev-up
    - make dev-down
    - make migrate
    - make load-fixtures
    - make ingest FILE=<private-path> BUSINESS_LINE=<slug>
    - make inspect-ingestion JOB_ID=<id>
    - make approve-ingestion JOB_ID=<id>
    - make regression
    - make demo-run BUSINESS_LINE=<slug>
    - make run-ready-report BUSINESS_LINE=<slug>
phases:
  - id: phase_00
    name: engineering_fact_audit_and_baseline
    tasks: [P00-01, P00-02, P00-03]
  - id: phase_01
    name: modular_monolith_foundation
    depends_on: [phase_00]
    tasks: [P01-01, P01-02, P01-03]
  - id: phase_02
    name: core_contracts_truth_and_isolation
    depends_on: [phase_01]
    tasks: [P02-01, P02-02, P02-03]
  - id: phase_03
    name: ingestion_mapping_approval
    depends_on: [phase_02]
    tasks: [P03-01, P03-02, P03-03]
  - id: phase_04
    name: workflow_approval_audit
    depends_on: [phase_03]
    tasks: [P04-01, P04-02, P04-03]
  - id: phase_05
    name: leads_crm_draft_only
    depends_on: [phase_04]
    tasks: [P05-01, P05-02, P05-03]
  - id: phase_06
    name: customer_service_handoff
    depends_on: [phase_04]
    tasks: [P06-01, P06-02, P06-03]
  - id: phase_07
    name: content_video_serviceization
    depends_on: [phase_04]
    tasks: [P07-01, P07-02, P07-03]
  - id: phase_08
    name: real_supplier_data_onboarding_and_run_ready
    depends_on: [phase_03, phase_04, phase_05, phase_06, phase_07]
    blocked_if: [real_supplier_data_missing, unresolved_critical_conflicts]
    tasks: [P08-01, P08-02, P08-03]
